<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101d2b">
<title>Λεξιλόγιο — Greek Flashcards</title>
<style>
  :root{
    --ink:#0d1926; --deep:#101d2b; --slate:#1b2f42; --line:#2c465e;
    --marble:#f6f4ef; --paper:#fffdf8;
    --aegean:#3fb8b0; --aegean-dim:#276f6d;
    --coral:#e2725b; --sun:#e8b04b;
    --muted:#8fa6bb; --muted-dim:#5c748c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--deep);
    background-image:radial-gradient(120% 60% at 50% -10%, #1b3247 0%, #101d2b 60%);
    background-attachment:fixed;
    color:var(--marble);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px}

  header{margin-bottom:16px}
  h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
     font-size:29px;font-weight:600;letter-spacing:-.5px;margin:0;line-height:1}
  .sub{margin-top:6px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted-dim)}
  .sub b{color:var(--aegean);font-weight:700}

  .field{position:relative;margin-bottom:10px}
  select{width:100%;appearance:none;-webkit-appearance:none;background:var(--slate);
    color:var(--marble);border:1px solid var(--line);border-radius:13px;
    padding:13px 40px 13px 14px;font-size:15px;font-family:inherit;font-weight:500}
  .field::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:translateY(-70%) rotate(45deg);pointer-events:none}

  .row{display:flex;gap:7px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .chip{background:var(--slate);color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;
    font-family:inherit;cursor:pointer;letter-spacing:.2px}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--aegean-dim);border-color:var(--aegean);color:#eafffb}
  .chip.icon{padding:8px 11px;font-size:14px;line-height:1}
  .chip .badge{display:inline-block;margin-left:5px;background:var(--aegean);color:#062b29;
    border-radius:999px;padding:0 6px;font-size:10px;font-weight:800}
  .spacer{flex:1}

  /* filter panel */
  .panelbox{background:var(--slate);border:1px solid var(--line);border-radius:14px;
    padding:12px 13px 5px;margin-bottom:12px}
  .panelbox[hidden]{display:none}
  .grp{margin-bottom:10px}
  .grp h3{margin:0 0 6px;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--muted-dim);font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .tag-btn.on{background:var(--aegean);border-color:var(--aegean);color:#062b29;font-weight:700}
  .tag-btn .c{opacity:.6;font-size:11px;margin-left:4px}
  .panelfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    border-top:1px solid var(--line);padding:8px 0 5px;margin-top:2px}
  .panelfoot span{font-size:11px;color:var(--muted-dim)}
  .empty-note{font-size:12px;color:var(--muted);padding:4px 0 10px}

  .strip{display:flex;gap:2px;height:5px;margin-bottom:6px;overflow:hidden;border-radius:3px}
  .strip i{flex:1 1 0;min-width:1px;background:#24394d;border-radius:2px}
  .strip i.s1{background:var(--sun)}
  .strip i.s2{background:var(--aegean)}
  .strip i.cur{background:var(--marble)}
  .meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.8px;
    text-transform:uppercase;color:var(--muted-dim);margin-bottom:12px}

  /* card */
  .card{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px 20px;
    box-shadow:0 14px 34px rgba(0,0,0,.42);margin-bottom:12px}
  .cue{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#a39684;
    text-align:center;margin-bottom:12px}
  .prompt{font-size:clamp(21px,6.2vw,27px);font-weight:600;text-align:center;line-height:1.3;
    overflow-wrap:anywhere}
  .answer{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:clamp(23px,6.6vw,31px);font-weight:600;text-align:center;line-height:1.3;
    margin-top:14px;color:#14514e;overflow-wrap:anywhere}
  .answer.hidden-drill{color:#c9bfae;letter-spacing:5px}
  .cardnote{margin-top:10px;font-size:12.5px;line-height:1.55;color:#8a7c68;text-align:center;
    overflow-wrap:anywhere}

  .inputrow{display:flex;gap:8px;margin-top:16px}
  input[type=text]{flex:1;min-width:0;background:#f0ece2;border:1.5px solid #ddd4c4;
    border-radius:12px;padding:14px 13px;font-size:18px;font-family:"Iowan Old Style",Palatino,Georgia,serif;
    color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--aegean);background:#fff}
  input[type=text].bad{border-color:var(--coral);background:#fbeae6}
  .eye{flex:none;width:50px;background:#efe9dd;border:1.5px solid #ddd4c4;border-radius:12px;
    cursor:pointer;color:#8a7c68;display:flex;align-items:center;justify-content:center}
  .eye:active{background:#e3dccd}
  .eye svg{width:22px;height:22px}
  .go{width:100%;margin-top:9px;background:var(--aegean-dim);color:#eafffb;border:none;
    border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .go:active{transform:scale(.985)}

  .verdict{margin-top:13px;border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.5}
  .verdict.ok{background:#e2f4f1;color:#14514e;border:1px solid #a9ded7}
  .verdict.part{background:#fcf1dc;color:#7a5715;border:1px solid #ecd39a}
  .verdict.no{background:#fbeae6;color:#8d3722;border:1px solid #eec2b7}
  .verdict b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:16px}
  .drillcount{margin-top:11px;text-align:center;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:#a39684}
  .pips{display:inline-flex;gap:5px;margin-left:7px;vertical-align:middle}
  .pips i{width:8px;height:8px;border-radius:50%;background:#ddd4c4}
  .pips i.done{background:var(--aegean)}

  /* rating */
  .rate{display:flex;gap:6px;margin-bottom:14px}
  .rate button{flex:1;background:var(--slate);border:1px solid var(--line);color:var(--muted);
    border-radius:11px;padding:10px 4px;font-size:11.5px;font-weight:600;font-family:inherit;
    cursor:pointer;letter-spacing:.2px}
  .rate button.on0{background:#3a2a2a;border-color:#7a5148;color:#e5b3a6}
  .rate button.on1{background:#463a1e;border-color:var(--sun);color:#f4d79a}
  .rate button.on2{background:var(--aegean-dim);border-color:var(--aegean);color:#bff3ec}
  .reps{text-align:center;font-size:11px;color:var(--muted-dim);margin-bottom:14px;letter-spacing:.4px}

  .acts{display:flex;gap:9px;margin-bottom:8px}
  .nav{flex:none;width:50px;background:var(--slate);border:1px solid var(--line);color:var(--muted);
    border-radius:13px;font-size:19px;font-family:inherit;cursor:pointer}
  .nav:disabled{opacity:.3}
  .btn{flex:1;border-radius:13px;border:1px solid var(--line);background:var(--slate);
    color:var(--muted);padding:14px 8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  .solid{background:var(--aegean);border-color:var(--aegean);color:#062b29}
  .again{background:rgba(226,114,91,.16);border-color:rgba(226,114,91,.5);color:#f0a08e}
  .card.tappable{cursor:pointer}

  /* mode switch */
  .seg{display:flex;background:var(--slate);border:1px solid var(--line);border-radius:999px;
    padding:3px;margin-bottom:10px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:12.5px;
    font-weight:600;padding:8px 4px;border-radius:999px;cursor:pointer;letter-spacing:.2px;white-space:nowrap}

  /* lesson */
  #lesson[hidden]{display:none}
  .md{background:var(--paper);color:var(--ink);border-radius:20px;padding:20px 16px 8px;
    box-shadow:0 14px 34px rgba(0,0,0,.42);margin-bottom:14px;font-size:15px;line-height:1.6}
  .md h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:25px;
    line-height:1.2;margin:0 0 10px;font-weight:600}
  .md h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:19px;
    margin:24px 0 8px;font-weight:600;color:#14514e}
  .md h3{font-size:13px;letter-spacing:.3px;color:#8a7c68;margin:18px 0 6px;font-weight:700}
  .md p{margin:0 0 12px}
  .md ul,.md ol{margin:0 0 12px;padding-left:20px}
  .md li{margin:3px 0}
  .md strong{font-weight:700}
  .md em{color:#6b604f}
  .md hr{border:none;border-top:1px solid #e4ddcf;margin:18px 0}
  .md blockquote{margin:0 0 12px;padding:9px 12px;background:#f3efe6;border-left:3px solid var(--aegean);
    border-radius:0 10px 10px 0;font-size:14px}
  .md code{background:#efe9dd;border-radius:4px;padding:0 4px;font-size:.92em}
  .md .tbl{overflow-x:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
  .md table{border-collapse:collapse;font-size:14px;min-width:100%}
  .md th,.md td{padding:6px 6px;border-bottom:1px solid #e4ddcf;text-align:left;white-space:nowrap}
  .md th{font-size:12.5px;color:#8a7c68;font-weight:700}
  .md td:first-child{color:#8a7c68;font-size:13px;white-space:normal;min-width:44px}
  .md tbody tr:nth-child(odd){background:#faf7f0}
  @media (max-width:420px){
    .md table{font-size:13px}
    .md th,.md td{padding:6px 4px}
    .md th{font-size:12px}
    .md td:first-child{font-size:12px;min-width:38px}
  }
  .md .st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
  .md .st1{background:var(--sun)}
  .md .st2{background:var(--aegean)}
  #startdrill{width:100%}
  .seg button.on{background:var(--aegean-dim);color:#eafffb}

  /* multiple choice */
  .choices{display:grid;gap:8px;margin-top:16px}
  .opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:#f3efe6;border:1.5px solid #ddd4c4;border-radius:12px;padding:12px 13px;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:18px;
    color:var(--ink);cursor:pointer;line-height:1.3;overflow-wrap:anywhere}
  .opt .k{flex:none;width:22px;height:22px;border-radius:6px;background:#e4ddcf;color:#8a7c68;
    font:700 11px/22px system-ui,sans-serif;text-align:center}
  .opt:active:not(:disabled){transform:scale(.985)}
  .opt:disabled{cursor:default}
  .opt.right{background:#e2f4f1;border-color:var(--aegean);color:#14514e}
  .opt.right .k{background:var(--aegean);color:#062b29}
  .opt.wrong{background:#fbeae6;border-color:var(--coral);color:#8d3722}
  .opt.wrong .k{background:var(--coral);color:#fff}
  .opt.dim{opacity:.45}
  .opt.en{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}

  .panel{background:var(--slate);border:1px solid var(--line);border-radius:20px;
    padding:32px 22px;text-align:center;margin-bottom:16px}
  .panel h2{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:24px;margin:0 0 6px;font-weight:600}
  .panel p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6}
  .panel .n{color:var(--aegean);font-weight:700}
  .stack{display:flex;flex-direction:column;gap:8px}

  footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:10px}
  .fnote{font-size:11px;color:var(--muted-dim);line-height:1.5}
  .link{background:none;border:none;color:var(--muted-dim);font-family:inherit;font-size:11px;
    text-decoration:underline;cursor:pointer;padding:6px 0;flex:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Λεξιλόγιο</h1>
    <div class="sub"><b id="mastered">0</b> mastered · <span id="learningct">0</span> learning · <span id="grandtotal">0</span> cards</div>
  </header>

  <div class="field"><select id="section" aria-label="Choose a section"></select></div>

  <div class="seg" id="mode" role="radiogroup" aria-label="Study mode">
    <button data-mode="lesson" role="radio">📖 Lesson</button>
    <button data-mode="type" role="radio">⌨ Type</button>
    <button data-mode="choice" role="radio">☰ Choice</button>
    <button data-mode="flip" role="radio">🂠 Flip</button>
  </div>

  <div class="row" id="drillrow">
    <button class="chip" id="dir" hidden>GR → EN</button>
    <button class="chip" id="hidemastered">Hide mastered</button>
    <button class="chip" id="facets">Filters</button>
    <span class="spacer"></span>
    <button class="chip icon" id="shuffle" aria-label="Shuffle deck">⇄</button>
    <button class="chip icon" id="restart" aria-label="Start over">↺</button>
  </div>

  <div class="panelbox" id="facetbox" hidden>
    <div id="facetgroups"></div>
    <div class="panelfoot">
      <span id="facetsummary">Pick attributes to narrow the deck.</span>
      <button class="link" id="clearfacets">Clear all</button>
    </div>
  </div>

  <div class="strip" id="strip" aria-hidden="true"></div>
  <div class="meta" id="metarow"><span id="pos">—</span><span id="sectionstat">—</span></div>

  <div id="lesson" hidden>
    <article class="md" id="lessonbody"></article>
    <button class="btn solid" id="startdrill">Start drilling ›</button>
  </div>

  <div id="study">
    <div class="card" id="cardbox">
      <div class="cue" id="cue">type the greek</div>
      <div class="prompt" id="prompt"></div>
      <div class="answer" id="answer" hidden></div>
      <div class="cardnote" id="cardnote" hidden></div>

      <div class="choices" id="choices" hidden></div>

      <div id="entry">
        <div class="inputrow">
          <input type="text" id="typed" autocomplete="off" autocorrect="off"
                 autocapitalize="none" spellcheck="false" enterkeyhint="go"
                 placeholder="γράψε εδώ…" aria-label="Type the Greek word">
          <button class="eye" id="reveal" aria-label="Show me the word">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <button class="go" id="check">Check</button>
        <div class="drillcount" id="drillcount" hidden></div>
      </div>

      <div class="verdict" id="verdict" hidden></div>
    </div>

    <div class="acts" id="flipacts" hidden>
      <button class="btn again" id="fno">Didn't know</button>
      <button class="btn solid" id="fyes">Knew it</button>
    </div>

    <div class="rate" id="rate">
      <button data-s="0">○ Unlearned</button>
      <button data-s="1">◐ Learning</button>
      <button data-s="2">● Mastered</button>
    </div>
    <div class="reps" id="reps"></div>

    <div class="acts">
      <button class="nav" id="prev" aria-label="Previous card">‹</button>
      <button class="btn" id="skip">Skip</button>
      <button class="btn solid" id="next" hidden>Next card ›</button>
    </div>
  </div>

  <div id="done" class="panel" hidden>
    <h2 id="donetitle">Deck finished</h2>
    <p id="donetext"></p>
    <div class="stack">
      <button class="btn solid" id="againdeck">Go through it again</button>
      <button class="btn" id="drillmissed" hidden>Drill only what I missed</button>
    </div>
  </div>

  <footer>
    <span class="fnote">Progress saves in this browser.</span>
    <button class="link" id="reset">Reset progress</button>
  </footer>
</div>

/* Fold accents, final sigma and case so "μηλο" can be compared with "το μήλο". */
function fold(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/ς/g,'σ').toLowerCase().replace(/\s+/g,' ').trim();
}
const norm=s=>(s||'').replace(/\s+/g,' ').trim();
function dropArticle(s){
  const p=norm(s).split(' ');
  return (p.length>1 && ARTICLES.includes(fold(p[0]))) ? p.slice(1).join(' ') : norm(s);
}
/* One card can hold several acceptable spellings: slash alternatives
   ("ο δάσκαλος / η δασκάλα") and parenthetical plurals ("το πουλί (pl. τα πουλιά)"). */
function variants(card){
  const out=new Set(); const raw=card.gr;
  const noParen=norm(raw.replace(/\([^)]*\)/g,''));
  const inParen=[...raw.matchAll(/\((?:pl\.\s*)?([^)]*)\)/g)].map(m=>norm(m[1]));
  // the whole string as written is always acceptable, slashes and all
  if(norm(raw)) out.add(norm(raw));
  if(noParen) out.add(noParen);
  [raw,noParen,...inParen].forEach(chunk=>{
    if(!chunk) return;
    chunk.split(/\s*\/\s*/).forEach(v=>{ v=norm(v); if(v && !/^-/.test(v)) out.add(v); });
  });
  return [...out];
}
/* Returns: exact | accent | article | accent+article | wrong */
function grade(input,card){
  const inp=norm(input);
  if(!inp) return {verdict:'wrong',issues:[]};
  const isNoun=(card.tags||[]).includes('noun');
  for(const v of variants(card)){
    if(inp.toLowerCase()===v.toLowerCase()) return {verdict:'exact',issues:[]};
  }
  const issues=[];
  for(const v of variants(card)){
    const accentOnly = fold(inp)===fold(v);
    if(accentOnly) return {verdict:'partial',issues:['accents']};
  }
  if(isNoun){
    for(const v of variants(card)){
      const vNo=dropArticle(v), iNo=dropArticle(inp);
      if(iNo.toLowerCase()===vNo.toLowerCase() && fold(inp)!==fold(v))
        return {verdict:'partial',issues:['article']};
      if(fold(iNo)===fold(vNo)){
        const miss=['article']; if(fold(inp)!==fold(v)) miss.push('accents');
        return {verdict:'partial',issues:miss};
      }
    }
  }
  return {verdict:'wrong',issues:[]};
}

# Mediopassive -ομαι verbs

Verbs ending in **-μαι** use the *mediopassive* voice. Despite the name, few of these are passive in meaning. Some are reflexive — ντύνομαι, *I dress myself* — and many are **deponents**, verbs that only exist in this form: κοιμάμαι, θυμάμαι, σκέφτομαι, εργάζομαι.

## The endings

There are four patterns. The ending of the εγώ form tells you which one a verb follows.

| | -ομαι | -άμαι | -ούμαι | -ιέμαι |
|---|---|---|---|---|
| εγώ | -ομαι | -άμαι | -ούμαι | -ιέμαι |
| εσύ | -εσαι | -άσαι | -είσαι | -ιέσαι |
| αυτός | -εται | -άται | -είται | -ιέται |
| εμείς | -όμαστε | -όμαστε | -ούμαστε | -ιόμαστε |
| εσείς | -εστε | -άστε | -είστε | -ιέστε |
| αυτοί | -ονται | -ούνται | -ούνται | -ιούνται |

> **Stress shift.** Plain -ομαι verbs keep the stress on the stem, except in εμείς where it moves to the ending: σηκώνομαι → **σηκωνόμαστε**.

> **The -εί- forms.** -ούμαι verbs switch to -εί- for εσύ, αυτός and εσείς: ασχολούμαι → ασχολ**εί**σαι, ασχολ**εί**ται, ασχολ**εί**στε.

## One verb from each pattern

# Present, past & future

Every verb here is drilled in three tenses:

- **Present** — happening now, or habitually: τρώω, *I eat*
- **Past** (aorist) — a single completed action: έφαγα, *I ate*
- **Future** — **θα** plus the *past* stem, not the present one: θα φάω, *I will eat*

## Regular endings

{{conjugate verbs=γράφω tense=present,past,future}}

The irregular verbs change their stem, but mostly keep these endings.

> **The augment.** The past is stressed on the third syllable from the end. When a form is too short for that, it adds **έ-** in front: **έ**γραψα, **έ**φυγα — but γράψαμε, φύγαμε, which are already long enough.

> **Fixed stems.** Some irregular pasts begin with a vowel that never drops: **ή**πια, **ή**πιαμε · **ή**ρθα, **ή**ρθαμε · **εί**δα, **εί**δαμε.

> **είμαι** has no aorist. Its past is ήμουν (*I was*, *I used to be*) and its future is simply θα είμαι.

## Contract verbs

μιλάω and ρωτάω take **-άω, -άς, -άει, -άμε, -άτε, -άνε** in the present, and **-ησα** in the past: μίλησα, ρώτησα.

# Verbs (B2)

Every verb here ends in a stressed **-ώ**. They all follow one pattern, and in the present the stress always stays on the ending.

## Present tense

| | Ending | μπορώ | συμφωνώ |
|---|---|---|---|
| εγώ | -ώ | μπορώ | συμφωνώ |
| εσύ | -είς | μπορείς | συμφωνείς |
| αυτός | -εί | μπορεί | συμφωνεί |
| εμείς | -ούμε | μπορούμε | συμφωνούμε |
| εσείς | -είτε | μπορείτε | συμφωνείτε |
| αυτοί | -ούν(ε) | μπορούν(ε) | συμφωνούν(ε) |

> **Not the -άω pattern.** Verbs like μιλάω (μιλάς, μιλάει) are a different group. These -ώ verbs use **-εί-**: αργείς, ανησυχεί, οδηγείτε.

## Past tense

Most of these verbs form the past with **-ησα**. A few, like μπορώ and συγχωρώ, take **-εσα** instead.

| | -ησα | συμφωνώ | -εσα | μπορώ |
|---|---|---|---|---|
| εγώ | -ησα | συμφώνησα | -εσα | μπόρεσα |
| εσύ | -ησες | συμφώνησες | -εσες | μπόρεσες |
| αυτός | -ησε | συμφώνησε | -εσε | μπόρεσε |
| εμείς | -ήσαμε | συμφωνήσαμε | -έσαμε | μπορέσαμε |
| εσείς | -ήσατε | συμφωνήσατε | -έσατε | μπορέσατε |
| αυτοί | -ησαν | συμφώνησαν | -εσαν | μπόρεσαν |

> **Stress moves back.** In the past the stress sits on the third syllable from the end, so it leaves the ending: συμφων**ώ** → συμφ**ώ**νησα. In εμείς and εσείς the form is longer, so it moves forward again: συμφων**ή**σαμε.

## The verbs

Each verb is shown with its past (εγώ) form.

    cards.forEach(c=>{
      const ts=(c.tags||[]).filter(t=>(GROUP_OF[t]||'type')===a.group);
      (ts.length?ts:['other']).forEach(t=>{ if(!buckets.has(t)) buckets.set(t,[]); buckets.get(t).push(c); });
    });
    const rank=t=>{const n=LESSON_ORDER.indexOf(t);return n<0?999:n;};
    return [...buckets.keys()].sort((x,y)=>rank(x)-rank(y))
      .map(t=>`### ${LESSON_HEAD[t]||t} · ${buckets.get(t).length}\n\n${buckets.get(t).map(line).join('\n')}`)
      .join('\n\n');
  },

  conjugate(a){
    const verbs=(a.verbs||'').split(',').map(findVerb).filter(Boolean);
    const tenses=(a.tense||'present').split(',').filter(t=>verbs.every(v=>v[t]));
    if(!verbs.length||!tenses.length) return '';
    const cols=[]; verbs.forEach(v=>tenses.forEach(t=>cols.push({v,t})));
    const head=c=> verbs.length>1&&tenses.length>1 ? `${c.v.gr} (${c.t})` : verbs.length>1 ? c.v.gr : c.t;
    return [`| | ${cols.map(head).join(' | ')} |`, `|${'---|'.repeat(cols.length+1)}`,
      ...PERSON_TAGS.map((p,n)=>`| ${p} | ${cols.map(c=>c.v[c.t][n]).join(' | ')} |`)].join('\n');
  },

  'principal-parts'(){
    const groups=[['Irregular',v=>IRREGULAR.has(v.gr)],['Regular',v=>!IRREGULAR.has(v.gr)&&!CONTRACT.has(v.gr)],
      ['Contract (-άω)',v=>CONTRACT.has(v.gr)]];
    return groups.map(([name,test])=>{
      const vs=VERBS.filter(test); if(!vs.length) return '';
      return `### ${name} · ${vs.length}\n\n| | Present | Past | Future |\n|---|---|---|---|\n`+
        vs.map(v=>`| to ${v.enBase} | ${v.present[0]} | ${v.past[0]} | ${v.future[0]} |`).join('\n');
    }).filter(Boolean).join('\n\n');
  },
};

function lessonMarkdown(){
  const words=DB[sec].words;
  const tpl=LESSONS[sec] || (words.every(c=>(c.tags||[]).includes('noun')) ? LESSONS.nouns : LESSONS.generic);
  return tpl.replace(/\{\{\s*([\w-]+)([^}]*)\}\}/g,(m,name,rest)=>{
    const fn=LESSON_BLOCKS[name]; if(!fn) return m;
    const args={}; rest.trim().split(/\s+/).filter(Boolean).forEach(kv=>{const [k,...v]=kv.split('=');args[k]=v.join('=');});
    return fn(args);
  });
}

/* Minimal markdown: # headings, paragraphs, - and 1. lists, > quotes, --- rules,
   | tables |, **bold**, *italic*, `code`. Text is escaped before any markup is added. */
function renderMarkdown(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=s=>esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/⟦([12])⟧/g,'<span class="st st$1"></span>');
  const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  const lines=src.split('\n'), out=[];
  let n=0;
  while(n<lines.length){
    const l=lines[n];
    if(!l.trim()){ n++; continue; }
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); n++; continue; }
    if(/^\s*---+\s*$/.test(l)){ out.push('<hr>'); n++; continue; }
    if(/^\s*\|/.test(l) && /^\s*\|[\s|:-]+\|?\s*$/.test(lines[n+1]||'')){
      const head=cells(l); n+=2; const rows=[];
      while(n<lines.length && /^\s*\|/.test(lines[n])) rows.push(cells(lines[n++]));
      out.push('<div class="tbl"><table><thead><tr>'+head.map(h=>`<th>${inline(h)}</th>`).join('')+
        '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+
        '</tbody></table></div>');
      continue;
    }
    if(/^\s*>/.test(l)){
      const q=[]; while(n<lines.length && /^\s*>/.test(lines[n])) q.push(lines[n++].replace(/^\s*>\s?/,''));
      out.push(`<blockquote>${inline(q.join(' '))}</blockquote>`); continue;
    }
    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      const ordered=/^\s*\d+\./.test(l), items=[];
      while(n<lines.length && (ordered?/^\s*\d+\.\s+/:/^\s*[-*]\s+/).test(lines[n]))
        items.push(lines[n++].replace(/^\s*([-*]|\d+\.)\s+/,''));
      const tag=ordered?'ol':'ul';
      out.push(`<${tag}>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</${tag}>`); continue;
    }
    const para=[];
    while(n<lines.length && lines[n].trim() && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+\.\s|\s*>|\s*\||\s*---+\s*$)/.test(lines[n])) para.push(lines[n++]);
    out.push(`<p>${inline(para.join(' '))}</p>`);
  }
  return out.join('\n');
}

/* Returns the right card plus up to options-1 distractors, in random order.
   Tries the strictest match on each pool before relaxing a group, so a close
   match from the whole section beats a loose one from the filter. */
function buildChoices(c){
  const want=CHOICE_CONFIG.options-1;
  const groups=CHOICE_CONFIG.match[sec]||CHOICE_CONFIG.match.default;
  const poolOf={filtered:()=>DB[sec].words.filter(matches), section:()=>DB[sec].words};
  const picked=[], taken=new Set([optionText(c)]);
  for(let g=groups.length; g>=0 && picked.length<want; g--){
    const use=groups.slice(0,g);
    for(const p of CHOICE_CONFIG.pools){
      for(const x of shuffled(poolOf[p]())){
        if(picked.length>=want) break;
        const t=optionText(x);
        if(x===c || taken.has(t) || !sameOn(x,c,use)) continue;   // never show two identical buttons
        picked.push(x); taken.add(t);
      }
      if(picked.length>=want) break;
    }
  }
  return shuffled([c,...picked]);
}
let finished=false, missedCards=[], seenRight=0, seenWrong=0;
/* per-card turn state */
let phase='ask';        // ask | drill | resolved
let drillDone=0, drillVisible=true, cameFromReveal=false, countedThisCard=false;
let choiceOpts=null, choicePicked=-1;   // built once per card so options don't reshuffle on redraw

/* A missed card gets slotted back in a few cards ahead so it comes round again
   while it's still fresh. It keeps returning until it's answered unaided. */
const REQUEUE_MIN=3, REQUEUE_MAX=8;
function markMissed(c){ if(!missedCards.includes(c)) missedCards.push(c); }
function requeue(c){
  const gap=REQUEUE_MIN+Math.floor(Math.random()*(REQUEUE_MAX-REQUEUE_MIN+1));
  const at=Math.min(i+gap,deck.length);
  deck.splice(at,0,c);
  return at-i;
}

const $=id=>document.getElementById(id);
const tagsOf=c=>(c.tags||[]).concat([STATE_TAG[rec(sec,c).s]]);

function progressSel(){ return [...active].filter(t=>GROUP_OF[t]==='progress'); }
/* Cards left after the progress filter — the attribute lists are built from this. */
function pool(){
  const p=progressSel();
  return DB[sec].words.filter(c=>!p.length || p.includes(STATE_TAG[rec(sec,c).s]));
}
function matches(c){
  if(!active.size) return true;
  const byGroup={};
  active.forEach(t=>{const g=GROUP_OF[t]||'type';(byGroup[g]=byGroup[g]||[]).push(t);});
  const tags=tagsOf(c);
  return Object.values(byGroup).every(list=>list.some(t=>tags.includes(t)));
}
function pruneActive(){
  const avail=new Set();
  DB[sec].words.forEach(c=>(c.tags||[]).forEach(t=>avail.add(t)));
  STATE_TAG.forEach(t=>avail.add(t));
  [...active].forEach(t=>{ if(!avail.has(t)) active.delete(t); });
}
function sectionStats(k){
  const w=DB[k].words;
  let m=0,l=0; w.forEach(c=>{const s=rec(k,c).s; if(s===2)m++; else if(s===1)l++;});
  return {m,l,total:w.length};
}
function loadDeck(shuffle){
  pruneActive();
  deck=DB[sec].words.filter(matches).slice();
  if(shuffle) for(let n=deck.length-1;n>0;n--){const m=Math.floor(Math.random()*(n+1));[deck[n],deck[m]]=[deck[m],deck[n]];}
  i=0;finished=false;missedCards=[];seenRight=0;seenWrong=0;
  resetTurn();render();
}
function resetTurn(){
  phase='ask';drillDone=0;drillVisible=true;cameFromReveal=false;countedThisCard=false;
  choiceOpts=null;choicePicked=-1;
  $('typed').value='';$('typed').classList.remove('bad');
}

/* ===================== RENDER ===================== */
function buildSelect(){
  $('section').innerHTML=keys.map(k=>{
    const s=sectionStats(k);
    return `<option value="${k}"${k===sec?' selected':''}>${DB[k].label} · ${s.m}/${s.total}</option>`;
  }).join('');
}
function drawFacets(){
  const p=pool(), all=DB[sec].words;
  const counts={}, pcounts={};
  p.forEach(c=>(c.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  all.forEach(c=>{const t=STATE_TAG[rec(sec,c).s];pcounts[t]=(pcounts[t]||0)+1;});
  const html=GROUPS.map(g=>{
    let tags;
    if(g.key==='progress') tags=STATE_TAG.filter(t=>pcounts[t]);
    else{
      tags=Object.keys(counts).filter(t=>(GROUP_OF[t]||'type')===g.key);
      if(g.key==='person')      tags.sort((a,b)=>PERSON_TAGS.indexOf(a)-PERSON_TAGS.indexOf(b));
      else if(g.key==='tense')  tags.sort((a,b)=>['present','past','future'].indexOf(a)-['present','past','future'].indexOf(b));
      else tags.sort((a,b)=>counts[b]-counts[a]);
    }
    if(!tags.length) return '';
    return `<div class="grp"><h3>${g.label}</h3><div class="tags">`+
      tags.map(t=>`<button class="tag-btn${active.has(t)?' on':''}" data-tag="${t}">${t}<span class="c">${g.key==='progress'?pcounts[t]:counts[t]}</span></button>`).join('')+
      `</div></div>`;
  }).join('');
  $('facetgroups').innerHTML=html||'<p class="empty-note">No attributes to filter on here.</p>';
  $('facetgroups').querySelectorAll('.tag-btn').forEach(b=>{
    b.onclick=()=>{const t=b.dataset.tag;active.has(t)?active.delete(t):active.add(t);loadDeck(false);};
  });
  const n=active.size;
  $('facets').innerHTML='Filters'+(n?`<span class="badge">${n}</span>`:'');
  $('facets').classList.toggle('on',n>0);
  $('facetsummary').textContent=n?`${deck.length} of ${DB[sec].words.length} cards match.`:'Pick attributes to narrow the deck.';
  $('facetbox').hidden=!facetsOpen;
  const hm=progressSel().length===2&&!active.has('mastered');
  $('hidemastered').classList.toggle('on',hm);
}
function drawStrip(){
  $('strip').innerHTML=deck.map((c,n)=>{
    let cls='s'+rec(sec,c).s;
    if(!finished&&n===i) cls='cur';
    return `<i class="${cls}"></i>`;
  }).join('');
}
function render(){
  let M=0,L=0,T=0;
  keys.forEach(k=>{const s=sectionStats(k);M+=s.m;L+=s.l;T+=s.total;});
  $('mastered').textContent=M;$('learningct').textContent=L;$('grandtotal').textContent=T;
  const s=sectionStats(sec);
  $('sectionstat').textContent=`${s.m} mastered · ${s.l} learning`;
  buildSelect();drawFacets();

  const inLesson = mode==='lesson';
  $('lesson').hidden=!inLesson;
  $('strip').hidden=inLesson; $('metarow').hidden=inLesson;
  if(inLesson){
    $('study').hidden=true; $('done').hidden=true; $('facetbox').hidden=true;
    $('lessonbody').innerHTML=renderMarkdown(lessonMarkdown());
    return;
  }

  if(!deck.length){
    $('study').hidden=true;$('done').hidden=false;$('drillmissed').hidden=true;
    $('donetitle').textContent=active.size?'No cards match':'Nothing here';
    $('donetext').textContent=active.size
      ?'No card in this section has every attribute you picked. Try removing one.'
      :'This section is empty.';
    $('pos').textContent='0 cards';$('strip').innerHTML='';
    return;
  }
  if(finished){
    $('study').hidden=true;$('done').hidden=false;
    $('donetitle').textContent='Deck finished';
    $('donetext').innerHTML=`<span class="n">${seenRight}</span> right first try · <span class="n">${seenWrong}</span> missed`;
    $('drillmissed').hidden=missedCards.length===0;
    $('pos').textContent=`${deck.length} of ${deck.length}`;drawStrip();
    return;
  }
  $('study').hidden=false;$('done').hidden=true;

  const c=deck[i], r=rec(sec,c);
  $('prompt').textContent=c.en;
  $('pos').textContent=`${i+1} of ${deck.length}`;
  $('prev').disabled=i===0;
  drawStrip();

  // rating buttons
  [...$('rate').children].forEach(b=>{
    const on=+b.dataset.s===r.s;
    b.className=on?('on'+r.s):'';
  });
  $('reps').textContent = r.n>=MASTER_AT
    ? `Correct ${r.n}× — mastery threshold reached`
    : `Correct ${r.n}× · ${MASTER_AT-r.n} more to auto-master`;

  $('choices').hidden = mode!=='choice';
  if(mode==='choice'){
    const enGr = curDir()==='en-gr';
    const open = phase==='resolved';
    if(!choiceOpts) choiceOpts=buildChoices(c);
    $('prompt').textContent = enGr ? c.en : c.gr;
    $('answer').hidden=true;
    $('cardnote').hidden=!(open&&c.note);
    if(c.note) $('cardnote').textContent=c.note;
    $('entry').hidden=true; $('drillcount').hidden=true; $('flipacts').hidden=true;
    $('cardbox').classList.remove('tappable');
    $('cue').textContent = enGr ? 'pick the greek' : 'pick the english';
    $('choices').innerHTML = choiceOpts.map((o,n)=>{
      let cls='opt'+(enGr?'':' en');
      if(open){
        if(o===c) cls+=' right';
        else if(n===choicePicked) cls+=' wrong';
        else cls+=' dim';
      }
      return `<button class="${cls}" data-n="${n}"${open?' disabled':''}><span class="k">${n+1}</span><span></span></button>`;
    }).join('');
    // set text separately so Greek/English content is never parsed as markup
    $('choices').querySelectorAll('.opt').forEach((b,n)=>{
      b.lastElementChild.textContent=optionText(choiceOpts[n]);
      b.onclick=()=>pickChoice(n);
    });
    $('skip').hidden=open; $('next').hidden=!open;
    return;
  }

  if(mode==='flip'){
    // plain flashcards: one side, tap to turn it over, rate it yourself
    const showGreek = curDir()==='gr-en';
    const front = showGreek ? c.gr : c.en;
    const back  = showGreek ? c.en : c.gr;
    const open  = phase==='resolved';
    $('prompt').textContent=front;
    $('answer').hidden=!open;
    $('answer').classList.remove('hidden-drill');
    if(open) $('answer').textContent=back;
    $('cardnote').hidden=!(open&&c.note);
    if(c.note) $('cardnote').textContent=c.note;
    $('entry').hidden=true;
    $('drillcount').hidden=true;
    $('cardbox').classList.add('tappable');
    $('cue').textContent = open ? 'tap to hide' : 'tap to reveal';
    $('flipacts').hidden = !open;
    $('skip').hidden = open;
    $('next').hidden = !open;
    return;
  }
  $('cardbox').classList.remove('tappable');
  $('flipacts').hidden=true;

  const showAnswer = phase==='drill' ? drillVisible : phase==='resolved';
  $('answer').hidden=!showAnswer;
  $('answer').classList.remove('hidden-drill');
  if(showAnswer) $('answer').textContent=c.gr;
  else if(phase==='drill'){
    $('answer').hidden=false;
    $('answer').classList.add('hidden-drill');
    $('answer').textContent='•'.repeat(Math.min(c.gr.replace(/\s/g,'').length,14));
  }
  $('cardnote').hidden=!(phase==='resolved'&&c.note);
  if(c.note) $('cardnote').textContent=c.note;

  $('entry').hidden = phase==='resolved';
  $('skip').hidden  = phase==='resolved';
  $('next').hidden  = phase!=='resolved';
  $('cue').textContent = phase==='drill' ? `write it out ${DRILL_REPS}×` : 'type the greek';

  $('drillcount').hidden = phase!=='drill';
  if(phase==='drill'){
    $('drillcount').innerHTML='rep '+(drillDone+1)+' of '+DRILL_REPS+
      '<span class="pips">'+[0,1,2].map(n=>`<i class="${n<drillDone?'done':''}"></i>`).join('')+'</span>';
  }
  if(phase!=='resolved') setTimeout(()=>$('typed').focus(),30);
}
function verdict(cls,html){
  const v=$('verdict');v.hidden=false;v.className='verdict '+cls;v.innerHTML=html;
}

/* ===================== GRADING FLOW ===================== */
function bump(c,partial){
  const r=rec(sec,c);
  r.n++; if(partial) r.p++;
  if(r.n>=MASTER_AT) r.s=2; else if(r.s===0) r.s=1;
  save();
}
function demote(c){ const r=rec(sec,c); r.s=0; save(); }

function submit(){
  const c=deck[i], typed=$('typed').value;
  if(!norm(typed)) return;
  const g=grade(typed,c);

  if(phase==='drill'){
    if(g.verdict==='wrong'){
      $('typed').classList.add('bad');
      drillVisible=true;                       // show it again after a miss
      verdict('no',`Not yet — it's <b>${c.gr}</b>. Look closely, then try this rep again.`);
      $('typed').value='';render();return;
    }
    drillDone++;
    $('typed').value='';$('typed').classList.remove('bad');
    if(drillDone>=DRILL_REPS){
      demote(c);                                // revealed/missed → back to unlearned
      phase='resolved';
      const gap=requeue(c);                     // comes back in a few cards
      verdict('ok',`Three reps done. <b>${c.gr}</b> comes back in ${gap} cards — get it unaided to clear it.`);
    }else{
      drillVisible=false;                       // hidden for reps 2 and 3
      const note=g.verdict==='partial'?` (${g.issues.join(' & ')} off, but close enough)`:'';
      verdict('part',`Rep ${drillDone} done${note}. Now from memory.`);
    }
    render();return;
  }

  // first attempt on this card
  if(g.verdict==='wrong'){
    seenWrong++; markMissed(c);
    phase='drill';drillDone=0;drillVisible=true;
    $('typed').value='';$('typed').classList.add('bad');
    verdict('no',`Not quite — it's <b>${c.gr}</b>. Write it out ${DRILL_REPS}× to lock it in.`);
    render();return;
  }
  if(!countedThisCard&&!cameFromReveal){
    countedThisCard=true;seenRight++;bump(c,g.verdict==='partial');
  }
  phase='resolved';
  if(g.verdict==='exact') verdict('ok',`Correct — <b>${c.gr}</b>`);
  else verdict('part',`Close: <b>${c.gr}</b> — you missed the ${g.issues.join(' and ')}. Half credit, it still counts.`);
  render();
}

function doReveal(){
  const c=deck[i];
  cameFromReveal=true;
  seenWrong++; markMissed(c);
  phase='drill';drillDone=0;drillVisible=true;
  $('typed').value='';
  verdict('part',`It's <b>${c.gr}</b>. Write it out ${DRILL_REPS}× — hidden after the first — to move on.`);
  render();
}
function go(n){
  if(n>=deck.length){finished=true;render();return;}
  i=n;$('verdict').hidden=true;resetTurn();render();
}

/* Multiple choice: right first time counts a rep; a wrong pick demotes the card
   and requeues it, the same as a missed typed answer. */
function pickChoice(n){
  if(mode!=='choice' || phase==='resolved' || !choiceOpts) return;
  const c=deck[i], o=choiceOpts[n];
  choicePicked=n; phase='resolved';
  if(o===c){
    if(!countedThisCard){countedThisCard=true;seenRight++;bump(c,false);}
    verdict('ok',`Correct — <b>${c.gr}</b>`);
  }else{
    seenWrong++; markMissed(c); demote(c);
    const gap=requeue(c);
    verdict('no',`It's <b>${c.gr}</b>, not ${o.gr}. It comes back in ${gap} cards.`);
  }
  render();
}

/* ===================== EVENTS ===================== */
function applyMode(){
  $('mode').querySelectorAll('button').forEach(b=>{
    const on=b.dataset.mode===mode;
    b.classList.toggle('on',on); b.setAttribute('aria-checked',on);
  });
  $('dir').hidden = mode==='type' || mode==='lesson';
  $('dir').textContent = curDir()==='gr-en' ? 'GR → EN' : 'EN → GR';
  $('drillrow').hidden = mode==='lesson';     // filters, shuffle etc. only apply to drilling
}
function setMode(m){
  if(m===mode) return;
  const wasLesson = mode==='lesson';
  mode=m; if(DRILL_MODES.includes(m)) lastDrill=m;
  savePrefs();applyMode();$('verdict').hidden=true;resetTurn();render();
  if(wasLesson||m==='lesson') try{ window.scrollTo(0,0); }catch(e){}
}
$('mode').querySelectorAll('button').forEach(b=>{ b.onclick=()=>setMode(b.dataset.mode); });
$('startdrill').onclick=()=>setMode(lastDrill);
$('dir').onclick=()=>{
  dirs[mode] = curDir()==='gr-en' ? 'en-gr' : 'gr-en';
  savePrefs();applyMode();$('verdict').hidden=true;resetTurn();render();
};
/* 1–4 picks an option on a keyboard; Enter moves on once answered. */
document.addEventListener('keydown',e=>{
  if(mode!=='choice' || e.target.tagName==='INPUT' || e.target.tagName==='SELECT') return;
  const n=parseInt(e.key,10);
  if(n>=1 && choiceOpts && n<=choiceOpts.length){ e.preventDefault(); pickChoice(n-1); }
  else if(e.key==='Enter' && phase==='resolved'){ e.preventDefault(); go(i+1); }
});
$('cardbox').onclick=()=>{
  if(mode!=='flip') return;
  phase = phase==='resolved' ? 'ask' : 'resolved';
  render();
};
/* Self-rated in flip mode: no spelling to check, so the answer is your word. */
$('fyes').onclick=e=>{
  e.stopPropagation();
  const c=deck[i];
  if(!countedThisCard){countedThisCard=true;seenRight++;bump(c,false);}
  go(i+1);
};
$('fno').onclick=e=>{
  e.stopPropagation();
  const c=deck[i];
  seenWrong++;markMissed(c);demote(c);
  const gap=requeue(c);
  verdict('part',`Noted — <b>${c.gr}</b> comes back in ${gap} cards.`);
  const keep=$('verdict').innerHTML;
  go(i+1);
  $('verdict').hidden=false;$('verdict').className='verdict part';$('verdict').innerHTML=keep;
};

$('check').onclick=submit;
$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit();}});
$('reveal').onclick=doReveal;
$('next').onclick=()=>go(i+1);
$('skip').onclick=()=>go(i+1);
$('prev').onclick=()=>{if(i>0)go(i-1);};
$('rate').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{const r=rec(sec,deck[i]);r.s=+b.dataset.s;save();render();};
});
$('section').onchange=e=>{sec=e.target.value;$('verdict').hidden=true;loadDeck(false);};
$('facets').onclick=()=>{facetsOpen=!facetsOpen;$('facetbox').hidden=!facetsOpen;};
$('clearfacets').onclick=()=>{active.clear();loadDeck(false);};
$('hidemastered').onclick=()=>{
  const on=progressSel().length===2&&!active.has('mastered');
  STATE_TAG.forEach(t=>active.delete(t));
  if(!on){active.add('unlearned');active.add('learning');}
  loadDeck(false);
};
$('shuffle').onclick=()=>{$('verdict').hidden=true;loadDeck(true);};
$('restart').onclick=()=>{$('verdict').hidden=true;loadDeck(false);};
$('againdeck').onclick=()=>{$('verdict').hidden=true;loadDeck(true);};
$('drillmissed').onclick=()=>{
  deck=missedCards.slice();i=0;finished=false;missedCards=[];seenRight=0;seenWrong=0;
  $('verdict').hidden=true;resetTurn();render();
};
$('reset').onclick=()=>{
  if(confirm('Clear all saved progress and counts on this device?')){
    store={};save();$('verdict').hidden=true;loadDeck(false);
  }
};
applyMode();
loadDeck(false);
</script>
</body>
</html>
